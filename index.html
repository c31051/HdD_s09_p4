<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Docker</title>
</head>
<body style="font-family: Arial; margin: 50px;">

<h2>🧮 Sumadora Web (HTML + Python en Docker)</h2>

<input type="number" id="num1" placeholder="Número 1"> +
<input type="number" id="num2" placeholder="Número 2">

<button onclick="enviarSuma()">Sumar</button>

<h3 style="color: green;">Resultado: <span id="resultado">0</span></h3>

<script>
    async function enviarSuma() {
        const n1 = document.getElementById('num1').value;
        const n2 = document.getElementById('num2').value;

        // Hacemos la llamada "Fetch" directo al backend de Python (Puerto 5000)
        const respuesta = await fetch('http://localhost:5000/sumar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ n1: n1, n2: n2 })
        });

        const datos = await respuesta.json();
        // Pintamos el resultado en la pantalla
        document.getElementById('resultado').innerText = datos.resultado;
    }
</script>
</body>
</html>
